# Overlay para a VPS Premium (CentOS 7 + cPanel, kernel 3.10).
#
#   ./docker/frontend/build-vps.sh
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --build
#
# Duas particularidades dessa maquina:
#
# 1. A rede bridge do Docker nao tem saida para a internet (FORWARD DROP no
#    firewall). Containers conversam entre si normalmente, mas apt-get/npm
#    falham DURANTE O BUILD. Por isso o build usa a rede do host; em execucao
#    os servicos continuam na rede isolada nwbasset-network.
#
# 2. O `next build` nao roda dentro do `docker build` (ver o cabecalho de
#    docker/frontend/build-vps.sh). O script compila num container e deixa os
#    artefatos em .build/frontend; aqui a imagem do frontend e montada a partir
#    dessa pasta.

services:
  backend:
    build:
      network: host

  frontend:
    build:
      context: ./.build/frontend
      dockerfile: Dockerfile
      network: host
    # Node 24 em execucao usa as mesmas chamadas novas de escrita.
    security_opt:
      - seccomp=unconfined

  # 3. O PostgreSQL 18 (musl) tambem morre com "postmaster.pid: Operation not
  #    permitted" sob o seccomp padrao neste kernel. O nc-tech, nesta mesma VPS,
  #    resolve do mesmo jeito.
  postgres:
    security_opt:
      - seccomp=unconfined
