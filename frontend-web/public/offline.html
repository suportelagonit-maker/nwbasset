<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sem conexão | NWB Asset</title>
    <!--
      Página mostrada pelo service worker quando o aparelho está sem rede.
      É HTML puro de propósito: sem rede não há como baixar os scripts do
      Next, então qualquer página do aplicativo falharia ao carregar.
    -->
    <style>
      :root {
        --ink: #16181d;
        --muted: #70757f;
        --line: rgba(17, 24, 39, 0.08);
        --accent: #f6a400;
        --accent-deep: #e99400;
        --accent-soft: rgba(246, 164, 0, 0.12);
        --workspace-bg: #f6f7f9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
        background: var(--workspace-bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      }

      main {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 28px 24px 32px;
        text-align: center;
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.08);
      }

      img {
        width: 150px;
        height: auto;
      }

      .icone {
        margin: 24px auto 0;
        width: 56px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent-deep);
      }

      h1 {
        margin: 16px 0 0;
        font-size: 1.35rem;
        letter-spacing: -0.03em;
      }

      p {
        margin: 8px 0 0;
        font-size: 0.9rem;
        line-height: 1.6;
        color: var(--muted);
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 24px;
        height: 44px;
        padding: 0 24px;
        border-radius: 999px;
        background: var(--accent);
        color: #ffffff;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logoasset.png" alt="NWB Asset" />
      <span class="icone" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M3 3l18 18" />
          <path d="M8.5 16.5a5 5 0 0 1 7 0" />
          <path d="M5 13a9 9 0 0 1 3.5-2.2M19 13a9 9 0 0 0-7.5-2.9" />
          <path d="M2 9a14 14 0 0 1 4.5-2.9M22 9a14 14 0 0 0-9.5-3.9" />
          <circle cx="12" cy="20" r="0.8" fill="currentColor" stroke="none" />
        </svg>
      </span>
      <h1>Sem conexão com a internet</h1>
      <p>
        O NWB Asset precisa de rede para consultar e registrar informações do
        patrimônio. Verifique o Wi-Fi ou os dados móveis e tente de novo.
      </p>
      <a href="/dashboard/patrimonio">Tentar novamente</a>
    </main>
  </body>
</html>
