# NWB Asset — gestao patrimonial multiempresa
#
# Recursos exclusivos deste sistema. Nao compartilhar containers, redes, volumes
# ou portas com os demais projetos da maquina (jornada, ncedu, ncinfra).
#
# Portas escolhidas apos verificar o que ja estava em uso:
#   5000 backend  | 5001 frontend | 5436 PostgreSQL
#   (5432 a 5435 ja estavam ocupadas por outros bancos)
#
# As portas sao publicadas apenas em 127.0.0.1 (BIND_HOST). Na VPS e o proxy
# reverso (Apache do cPanel) que expoe o sistema em 80/443; backend, frontend
# e banco nunca ficam acessiveis pela internet. Para testar de outro aparelho
# na rede local, use BIND_HOST=0.0.0.0 no .env.

# Logs vao para o stdout/stderr do container, com rotacao pelo Docker, para
# nao encher o disco (o Laravel usa LOG_CHANNEL=stderr, ver backend).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

name: nwbasset

services:
  postgres:
    image: postgres:18-alpine
    container_name: nwbasset-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_DATABASE:-nwbasset}
      POSTGRES_USER: ${DB_USERNAME:-nwbasset}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env da raiz}
      TZ: America/Sao_Paulo
    ports:
      - "${BIND_HOST:-127.0.0.1}:${DB_PORT_HOST:-5436}:5432"
    volumes:
      # PostgreSQL 18+ espera o mount em /var/lib/postgresql (e nao em
      # /var/lib/postgresql/data como nas versoes anteriores), para permitir
      # pg_upgrade --link sem cruzar limite de mount point.
      - nwbasset-postgres-data:/var/lib/postgresql
    networks:
      - nwbasset-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-nwbasset} -d ${DB_DATABASE:-nwbasset}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: production
    container_name: nwbasset-backend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Estas variaveis vencem o .env do Laravel: o Dotenv do Laravel e imutavel
      # e nao sobrescreve variaveis reais de ambiente.
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY:?copie APP_KEY do backend/.env para o .env da raiz}
      APP_URL: ${APP_URL:-http://localhost:5000}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-nwbasset}
      DB_USERNAME: ${DB_USERNAME:-nwbasset}
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH_CAPTCHA_ENABLED: ${AUTH_CAPTCHA_ENABLED:-false}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # NWB ID (Keycloak) + NWB Acessos — vazio = entrada so por e-mail e senha
      NWBID_ISSUER: ${NWBID_ISSUER:-}
      NWBID_CLIENTE: ${NWBID_CLIENTE:-nwb-asset}
      NWBID_CLIENTES_ACEITOS: ${NWBID_CLIENTES_ACEITOS:-nwb-asset}
      NWBID_SISTEMA: ${NWBID_SISTEMA:-nwb-asset}
      NWBID_EMPRESA_ADMIN_ID: ${NWBID_EMPRESA_ADMIN_ID:-}
      NWBID_ACESSOS_API_URL: ${NWBID_ACESSOS_API_URL:-}
      NWBID_ACESSOS_CLIENT_ID: ${NWBID_ACESSOS_CLIENT_ID:-}
      NWBID_ACESSOS_CLIENT_SECRET: ${NWBID_ACESSOS_CLIENT_SECRET:-}
      AUTH_LOGIN_SENHA: ${AUTH_LOGIN_SENHA:-false}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-5000}:80"
    volumes:
      # Uploads (imagens de bens, notas fiscais, logos) nao estao no Git.
      # Precisam de volume proprio ou se perdem a cada recriacao do container.
      - nwbasset-storage:/var/www/html/storage/app/public
      # O MESMO volume tambem em public/storage, que e por onde o Apache serve
      # os arquivos. O padrao do Laravel e um symlink criado por storage:link,
      # mas symlink do Linux nao pode ser criado dentro de um bind mount do
      # Windows — em desenvolvimento ele falhava e todo upload retornava 403.
      # Montar o volume nos dois caminhos dispensa o symlink e funciona igual
      # em qualquer sistema operacional.
      - nwbasset-storage:/var/www/html/public/storage
    networks:
      - nwbasset-network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5000/api/v1}
        NEXT_PUBLIC_LOGIN_CAPTCHA_ENABLED: ${NEXT_PUBLIC_LOGIN_CAPTCHA_ENABLED:-0}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    container_name: nwbasset-frontend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
    environment:
      # Endereco usado pelas rotas de servidor do Next (app/api/**) e pelos
      # componentes de servidor, que rodam DENTRO deste container. Aqui
      # "localhost" seria o proprio frontend, entao e preciso o nome do servico
      # na rede interna. Lido em tempo de execucao, sem rebuild.
      API_BASE_URL_INTERNAL: ${API_BASE_URL_INTERNAL:-http://backend/api/v1}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-5001}:5001"
    networks:
      - nwbasset-network

volumes:
  nwbasset-postgres-data:
    name: nwbasset-postgres-data
  nwbasset-storage:
    name: nwbasset-storage

networks:
  nwbasset-network:
    name: nwbasset-network
